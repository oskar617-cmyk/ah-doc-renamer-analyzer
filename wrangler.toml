name = "ah-doc-renamer-worker-analyzer"
main = "worker.js"
compatibility_date = "2026-06-01"

[vars]
ENTRA_TENANT_ID = "ff968505-cca0-4cd1-9f6d-68ce6eaf06c7"
ENTRA_CLIENT_ID = "3302edd3-505b-496d-ab66-707fa7a2d827"
ADMIN_EMAIL = "oskar@auhs.com.au"
RESERVED_EMAILS = "hello@vaef.app"
ACCESS_SHAREPOINT_HOST = "auzziehomes.sharepoint.com"
ACCESS_SITE_PATH = "/sites/AHSite"
ACCESS_LIST_PATH = "AH Apps Docs/AH Doc Renamer/allowed-users.json"
AH_FILES_CLIENT_ID = "595e53b0-9261-4fca-943e-0bf15f048fc4"
AH_FILES_ACCESS_PATH = "AH Apps Docs/AH Files/user-settings.json"
ADDITIONAL_CORS_ORIGINS = "https://ah-files.pages.dev,http://localhost:8137"

# Approximate per-location protection, not a global quota or spending cap.
[[ratelimits]]
name = "ANALYZER_IP_LIMITER"
namespace_id = "33025051"
[ratelimits.simple]
limit = 240
period = 60

[[ratelimits]]
name = "ANALYZER_USER_LIMITER"
namespace_id = "33025052"
[ratelimits.simple]
limit = 60
period = 60

# Secrets are NOT stored in this file (it is committed to GitHub).
# Set them in Cloudflare as SECRET type:
#   Workers & Pages -> ah-doc-renamer-worker-analyzer -> Settings -> Variables and Secrets
#     GEMINI_API_KEY = <your Google AI Studio key>
#     CORS_ORIGINS   = https://ah-doc-renamer.pages.dev,https://oskar617-cmyk.github.io
#
# Expected Worker URL after deploy:
#   https://ah-doc-renamer-worker-analyzer.oskar617.workers.dev
